version: 1
project:
  title: MyST Listing
  plugins:
    # Release notes from GitHub ({release-notes}), loaded before myst-listing
    # so its collector runs before the listing render transform.
    - https://github.com/myst-contrib/myst-release-notes/releases/latest/download/index.mjs
    - ../dist/plugin.mjs
    # Shows each example's source alongside its rendered output ({myst:demo}).
    - https://raw.githubusercontent.com/jupyter-book/myst-plugins/main/plugins/demo/src/index.mjs
    # Live client-side filtering of listing items ({searchfilter}).
    - https://raw.githubusercontent.com/jupyter-book/myst-plugins/main/plugins/searchfilter/searchfilter.mjs
    # Inline icons via the Iconify API ({icon}), used for the navbar GitHub link.
    - https://github.com/myst-contrib/myst-iconify/releases/latest/download/index.mjs
    # Turns bare @handles in release notes into GitHub profile links; without
    # it they parse as unresolved citations and render as nothing.
    - https://github.com/jupyter-book/myst-plugins/releases/download/github-handle-links%402025-12-01/index.mjs
  toc:
    - file: index.md
    - file: collectors.md
    - file: transform.md
    - file: displays/index.md
      children:
        - file: displays/table.md
        - file: displays/gallery.md
        - file: displays/summary.md
        - file: displays/feed.md
        - file: displays/sections.md
    - file: contributing.md
    - file: extending.md
    - file: releases.md
    - title: Sample posts
      children:
        - pattern: posts/*.md
site:
  template: book-theme
  options:
    folders: true
    logo_text: MyST Listing
  parts:
    navbar_end: parts/navbar_end.md
