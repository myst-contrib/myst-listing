version: 1
project:
  title: MyST Listing
  plugins:
    - ../dist/plugin.mjs
    # Shows each example's source alongside its rendered output ({myst:demo}).
    - https://raw.githubusercontent.com/jupyter-book/myst-plugins/main/plugins/demo/src/index.mjs
    # Live client-side filtering of listing items ({searchfilter}).
    - https://raw.githubusercontent.com/jupyter-book/myst-plugins/main/plugins/searchfilter/searchfilter.mjs
  toc:
    - file: index.md
    - file: displays/index.md
      children:
        - file: displays/table.md
        - file: displays/gallery.md
        - file: displays/summary.md
    - file: developer.md
    - title: Sample posts
      children:
        - pattern: posts/*.md
site:
  template: book-theme
  options:
    folders: true
